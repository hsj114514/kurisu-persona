name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python pipeline/validate_schemas.py
      - run: python pipeline/build_persona.py --check
      - run: python -m unittest discover -s tests -v
      - run: python pipeline/package_release.py
